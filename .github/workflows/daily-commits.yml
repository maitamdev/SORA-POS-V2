name: Daily Contributions

on:
  schedule:
    # Runs at 16:30 UTC every day (23:30 in Vietnam time, UTC+7)
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  make-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Daily Commits
        run: |
          git config --local user.email "maitamit062005@gmail.com"
          git config --local user.name "maitamdev"
          
          # Create/update a streak log file inside .github directory
          mkdir -p .github
          STREAK_FILE=".github/daily_streak.txt"
          
          echo "=== Daily Streak Update: $(date) ===" >> $STREAK_FILE
          
          # Make 10 consecutive atomic commits
          for i in {1..10}
          do
            echo "Commit $i: $(date -u)" >> $STREAK_FILE
            git add $STREAK_FILE
            git commit -m "chore: update daily contribution graph ($i/10)"
          done

      - name: Push Commits
        run: |
          git push origin HEAD:${{ github.ref }}
